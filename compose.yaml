services:
  web:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
  db:
    image: postgres:17-bookworm
    profiles: [database]
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - assistant-db:/var/lib/postgresql/data
      - ./database/migrations/001_create_common.sql:/docker-entrypoint-initdb.d/001_create_common.sql:ro
      - ./database/migrations/002_housing_utilities.sql:/docker-entrypoint-initdb.d/002_housing_utilities.sql:ro
      - ./database/migrations/003_fixed_expenses.sql:/docker-entrypoint-initdb.d/003_fixed_expenses.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  assistant-db:
